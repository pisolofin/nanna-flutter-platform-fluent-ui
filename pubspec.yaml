name: nanna_platform_fluent_ui
description: Fluent UI platform extension for the Nanna Flutter package, enabling Windows and Fluent UI styled widget rendering for cross-platform apps.
version: 1.0.0
repository: https://github.com/pisolofin/nanna-flutter-platform-fluent-ui
issue_tracker: https://github.com/pisolofin/nanna-flutter-platform-fluent-ui/issues


environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  fluent_ui: ^4.16.1
  nanna: ^1.1.0
  nanna_platform: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
